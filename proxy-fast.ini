# 保存后运行 proxy-fast on；完整示例见 README「统一配置文件」。
# 价格按账号结算币种，磁盘与流量另计。AccessKey 使用环境变量或已有 profile。

[cloud]
region            = eu-west-2     # 地区：巴黎；例：ap-northeast-1
profile           =               # 凭证配置：留空默认；例：default

[instance]
price_limit       = 0.20          # 计算资源最高出价 / 小时；例：0.10
protection_hours  = 0             # 抢占保护期 / 小时：0 或 1；不是自动到期
zone              =               # 可用区：留空自动；例：eu-west-2a
instance_type     =               # 实例规格：留空自动；例：ecs.e-c1m1.large
image_id          =               # 镜像：留空自动；完整 ID 格式示例见 README

[disk]
size_gib          = 20            # 系统盘 / GiB：20–2048；例：40
category          = auto          # 磁盘类型：自动；例：cloud_essd

[network]
bandwidth_mbps    = 100           # 出口上限 / Mbps：1–100；例：20；流量按量计费

[controller]
timeout_seconds   = 600           # 等待时限 / 秒：30–3600；例：900
state_dir         =               # 状态目录：留空默认；例：./state/node-a

# 已有资源时保持原 state_dir；改部署参数需先 off 再 on。
